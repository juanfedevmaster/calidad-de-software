spring:
  application:
    name: parabank-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parabank}
    username: ${DB_USERNAME:parabank_user}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

parabank:
  security:
    jwt:
      secret: ${JWT_SECRET:calidad2026}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
