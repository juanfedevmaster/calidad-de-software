<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SauceDemo — Catálogo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <a href="index.html" class="brand-link">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1" y="1" width="30" height="30" rx="8" stroke="currentColor" stroke-width="2"/>
                    <circle cx="16" cy="16" r="4.5" fill="currentColor"/>
                </svg>
            </span>
            <h1>SauceDemo</h1>
        </a>
        <a href="cart.html" class="cart-link">
            <svg class="cart-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M2 3h2l1.6 9.6a1.5 1.5 0 0 0 1.48 1.25h7.24a1.5 1.5 0 0 0 1.48-1.25L17 6.5H5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="8" cy="17.5" r="1.25" fill="currentColor"/>
                <circle cx="14.5" cy="17.5" r="1.25" fill="currentColor"/>
            </svg>
            <span>Carrito</span>
        </a>
    </header>

    <main>
        <div class="page-heading">
            <span class="eyebrow">Catálogo completo</span>
            <h2>Nuestros productos</h2>
        </div>
        <div id="catalog" class="catalog">
            <p>Cargando productos...</p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/catalog.js"></script>
</body>
</html>
