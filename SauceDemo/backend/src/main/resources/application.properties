spring.application.name=saucedemo
server.port=8080

# Conexion a Neon (PostgreSQL)
# La password se toma del archivo .env (variable DB_PASSWORD), que NO se sube al repositorio.
spring.datasource.url=jdbc:postgresql://ep-red-block-ayfuz330.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
